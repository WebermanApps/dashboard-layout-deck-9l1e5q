<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light"><meta name="robots" content="noindex"><title>Dashboard Layout Deck</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Khand:wght@600;700&family=Hind:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#fbf8f1;--card:#fff;--fg:#0a0a0a;--pri:#171717;--mut:#737373;--bd:#e5e5e5;--yes:#0B6E4F;--no:#737373;--love:#dc2626;--maybe:#b45309;--blue:#155dfc}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--fg);font-family:Hind,system-ui,sans-serif;font-size:16px;overflow-x:hidden}
h1,h2,h3,.k{font-family:Khand,Hind,sans-serif;font-weight:700}
.wrap{max-width:560px;margin:0 auto;padding:max(10px,env(safe-area-inset-top)) 16px 24px}
.top{display:flex;align-items:center;gap:4px}.top a,.top button{white-space:nowrap}.top .back{margin-right:auto}.dk{display:inline-flex;align-items:center;min-height:44px;min-width:44px;padding:0 4px;color:var(--mut);font:600 .85rem Hind;text-decoration:underline}
.bdb{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:64px;margin:0 0 14px;background:var(--pri);color:#fafafa;border:2px solid var(--pri);font:700 1.35rem Khand;letter-spacing:.1em;text-transform:uppercase;text-decoration:none}.bdb svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.back{display:inline-flex;align-items:center;gap:6px;min-height:44px;min-width:44px;padding:0 10px 0 4px;color:var(--fg);text-decoration:none;font-family:Khand;font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:.95rem}
.back svg,.sbtn svg,.ab svg,.nb svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sbtn{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 12px;border:1.5px solid var(--yes);background:#fff;color:var(--yes);font:700 .95rem Khand;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}
h1{font-size:2rem;line-height:1.05;margin:6px 0 2px}.sub{color:var(--mut);margin:0 0 10px;font-size:.95rem}
.prog{display:flex;align-items:center;gap:10px;font:600 .95rem Hind;color:var(--mut)}.bar{flex:1;height:6px;background:var(--bd);border-radius:3px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--yes);transition:width .25s}
.stage{position:relative;height:500px;margin:12px 0 10px;touch-action:pan-y}
.card{position:absolute;inset:0;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:8px;box-shadow:0 4px 18px rgba(10,10,10,.06);transition:transform .25s ease-out,opacity .25s;user-select:none;-webkit-user-select:none;overflow:hidden}
.card.drag{transition:none}
.meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.tag{font:700 .78rem Khand;letter-spacing:.1em;text-transform:uppercase;padding:2px 8px;border:1px solid var(--pri);border-radius:999px}.tag.all{border-color:var(--bd);color:var(--mut)}.th{font-size:.82rem;color:var(--mut)}
.card h2{font-size:1.55rem;line-height:1.1;margin:2px 0 0}.card p{margin:0;line-height:1.45;font-size:1rem}
.viz{flex:1;display:flex;gap:10px;justify-content:center;align-items:center;min-height:0}.viz figure{margin:0;text-align:center;height:100%;display:flex;flex-direction:column;align-items:center}.viz svg{height:calc(100% - 20px);max-height:220px;width:auto}.viz figcaption{font:700 .75rem Khand;letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}
.stamp{position:absolute;top:18px;right:16px;font:700 1.3rem Khand;letter-spacing:.1em;padding:2px 10px;border:2px solid;opacity:0;transform:rotate(8deg)}
.nb{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 12px;background:#fff;border:1px solid var(--bd);font:600 .95rem Hind;cursor:pointer;color:var(--fg)}.nb.has{border-color:var(--blue);color:var(--blue)}
textarea{width:100%;min-height:64px;font:1rem Hind;border:1px solid var(--bd);padding:8px;border-radius:8px}
.answers{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.ab{min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:#fff;border:1.5px solid var(--pri);font:700 .95rem Khand;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;color:var(--fg);touch-action:manipulation}
.ab.no{color:var(--no);border-color:#a3a3a3}.ab.yes{color:#fff;background:var(--yes);border-color:var(--yes)}.ab.maybe{color:var(--maybe);border-color:#d6b98c}.ab.love{color:var(--love);border-color:#f0b4b4}.ab.love svg{fill:var(--love);stroke:var(--love)}
.skip{display:block;margin:6px auto 0;min-height:44px;min-width:88px;background:none;border:0;color:var(--mut);font:600 .95rem Hind;text-decoration:underline;cursor:pointer}
.mw-hover{transition:transform 180ms ease-out,box-shadow 180ms ease-out}.mw-hover:hover,.mw-hover:focus-visible{transform:translateY(-1px) scale(1.02);box-shadow:0 6px 18px rgba(10,10,10,.12)}@media(hover:none){.mw-hover:hover{transform:none;box-shadow:none}}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
#done{display:none}#done.on{display:block}.sum{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}.sum div{background:#fff;border:1px solid var(--bd);padding:10px;text-align:center}.sum b{display:block;font:700 1.6rem Khand}
#done .mws-wrap{max-width:none}#done .mws-btn{width:100%;min-height:64px;font-size:1.4rem}
.row2{display:flex;gap:8px;flex-wrap:wrap}.ob{min-height:44px;padding:0 16px;background:#fff;border:1.5px solid var(--pri);font:700 .95rem Khand;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;color:var(--fg)}
.share{margin:28px 0 8px;display:flex;flex-direction:column;align-items:center;gap:6px}.msg{color:var(--mut);font-size:.9rem;min-height:1.2em}
footer{text-align:center;padding:12px 0 calc(20px + env(safe-area-inset-bottom))}footer a{display:inline-flex;align-items:center;min-height:44px;padding:0 10px;color:var(--mut);text-decoration:none;font-size:.9rem}
.toast{position:fixed;left:50%;top:16px;transform:translateX(-50%);background:#fff;border:1.5px solid var(--yes);color:var(--yes);padding:10px 16px;font:700 1rem Khand;letter-spacing:.08em;display:none;z-index:9}
@media(min-width:900px){.wrap{max-width:720px;padding-top:24px}h1{font-size:2.6rem}.stage{height:560px}.card{padding:24px}.card h2{font-size:2rem}.card p{font-size:1.1rem}}
@media(min-width:2000px){html,body{font-size:20px}.wrap{max-width:960px;padding-top:40px}.stage{height:760px}.viz svg{max-height:340px}}
@media(max-height:760px) and (max-width:500px){.stage{height:440px}}
</style></head><body>
<div class="wrap">
<div class="top"><a class="back mw-hover" href="https://webermanapps.github.io/coach-dashboard/"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>Coach Dashboard</a>
<a class="dk mw-hover" href="https://webermanapps.github.io/branding-djqmb410/decks/">Deck Building</a><button class="sbtn mw-hover" id="early" type="button"><svg viewBox="0 0 24 24"><path d="M4 12l16-8-6 16-2-6z"/></svg>Submit</button></div>
<h1>Dashboard Layout Deck</h1><p class="sub">100 Layout Ideas For Every Agent Dashboard. Swipe Right For Yes, Left For No.</p>
<div class="prog"><span id="count">1 / 100</span><div class="bar"><i id="pb"></i></div><span id="ans">0 Answered</span></div>
<div id="play"><div class="stage" id="stage" data-ptr-ignore></div>
<div class="answers"><button class="ab no mw-hover" data-a="no" type="button"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>No</button>
<button class="ab maybe mw-hover" data-a="maybe" type="button"><svg viewBox="0 0 24 24"><path d="M9 9a3 3 0 1 1 4 2.8c-.7.3-1 .9-1 1.7V15M12 18.5v.01"/></svg>Maybe</button>
<button class="ab love mw-hover" data-a="love" type="button"><svg viewBox="0 0 24 24"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg>Love</button>
<button class="ab yes mw-hover" data-a="yes" type="button"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>Yes</button></div>
<button class="skip" id="skip" type="button">Skip</button></div>
<div id="done"><a class="bdb mw-hover" id="bdb" href="https://webermanapps.github.io/branding-djqmb410/decks/"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>Back to Deck Building</a><h2 id="dh">All Done</h2><p class="sub" id="dp">Your answers are saved on this device. Tap Submit to send them to Coach.</p><div class="sum" id="sum"></div>
<div id="sub"></div><div class="row2"><button class="ob mw-hover" id="copy" type="button">Copy Results</button><button class="ob mw-hover" id="review" type="button">Review Skipped</button></div><p class="msg" id="cmsg" role="status"></p></div>
<div class="share"><button class="ob mw-hover" id="share" type="button">Share</button><span class="msg" id="smsg" role="status"></span></div>
</div><footer><a class="mw-hover" href="https://maxweberman.com">Built by Max Weberman</a></footer><div class="toast" id="toast">Sent</div>
<script src="submit.js?v=gr2"></script><script src="app.js?v=sub1"></script><script src="ptr.js" defer></script></body></html>
